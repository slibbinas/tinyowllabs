<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moved</title>
<!--
  2026-09-21 ~00:28-02:07 slibbinas.github.io turejo CNAME tinyowllabs.com, ir GitHub
  301 peradresavo slibbinas.github.io/<projektas>/... i tinyowllabs.com/<projektas>/....
  Narsykles 301 isimena - todel nerastas adresas cia grazinamas atgal i
  slibbinas.github.io su tuo paciu keliu (pvz. /TinyMakerWifi/landing/).
-->
<script>
(function () {
  var kelias = location.pathname;
  if (kelias !== "/" && kelias.indexOf("/tinystatus") !== 0 && kelias.indexOf("/wristcontrol") !== 0) {
    // Priedas "from=tinyowl" butinas: narsykle isiminusi 301 butent be jo, tad be priedo
    // grizimas atgal i slibbinas.github.io vel nukeltu cia - ratas.
    if (location.search.indexOf("from=tinyowl") >= 0) {
      return;
    }
    var q = location.search ? location.search + "&from=tinyowl" : "?from=tinyowl";
    // tinymakerwifi.com Worker (landing-proxy) tą naktį perdavė github 301, ir narsykles
    // isiminė, kad pats tinymakerwifi.com perkeltas cia. Tokius - atgal i tinymakerwifi.com.
    if (kelias.indexOf("/TinyMakerWifi/landing") === 0) {
      location.replace("https://tinymakerwifi.com/" + q + location.hash);
      return;
    }
    location.replace("https://slibbinas.github.io" + kelias + q + location.hash);
  }
})();
</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
<h1>Page not found</h1>
<p><a href="/">TinyOwl</a></p>
</main>
</body>
</html>
